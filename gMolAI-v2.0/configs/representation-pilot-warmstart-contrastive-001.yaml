schema_version: 1

# Short, provenance-locked contrastive calibration of the property-strong
# no-contrastive 15k encoder. Optimizer/scheduler state is deliberately reset.
model:
  architecture: masked_graph_vicreg
  hidden_dim: 256
  node_latent_dim: 128
  graph_latent_dim: 256
  gine_layers: 4
  dropout: 0.10
  vicreg_projector: true
  vicreg_projector_dim: 256

objective:
  node_mask_probability: 0.30
  bond_feature_mask_probability: 0.30
  bond_dropout_probability: 0.15
  easy_negative_ratio: 1.0
  hard_negative_ratio: 1.0
  hard_pool_ratio: 5.0
  node_weight: 1.0
  edge_existence_weight: 0.5
  edge_feature_weight: 1.0
  descriptor_weight: 0.25
  invariance_weight: 0.0
  variance_weight: 0.0
  covariance_weight: 0.0
  contrastive_space: projector
  contrastive_weight: 0.01
  contrastive_temperature: 0.1
  variance_target: 1.0
  minimum_effective_rank_ratio: 0.05
  collapse_penalty_weight: 10.0

training:
  seed: 42
  initialize_from_checkpoint: /nobackup/proj/disk/theo-storage/personal/jalil/gMolAI/gMolAI-retrain/runs/combined-zinc-pubchem-representation-pilot-novicreg/checkpoints/step-000015000.pt
  initialize_from_sha256: bb2359e6a621fe438120de35c12b8b63102543ba9915e14db321128aa7875b7a
  max_steps: 5000
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  warmup_steps: 250
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  precision: bf16
  checkpoint_every_steps: 500
  retain_every_steps: 500
  validate_every_steps: 2500
  log_every_steps: 20
  validation_max_graphs: 50000
  test_max_graphs: 250000
  resume: auto
