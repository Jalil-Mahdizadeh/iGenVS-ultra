[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "igenvs-ultra-pipeline"
version = "0.1.0"
description = "User-facing regular docking and target-specific ultra-scale molecular screening"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
igenvs-ultra = "igenvs_ultra.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
